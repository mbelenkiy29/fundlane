# Neon remains external. Never generate a replacement encryption key for existing data.
services:
  - type: web
    name: fundlane
    runtime: docker
    repo: https://github.com/mbelenkiy29/fundlane
    branch: main
    rootDir: nextjs-version
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: ohio
    plan: 1c-2g
    numInstances: 1
    healthCheckPath: /sign-in
    domains:
      - fundlane.io
      - www.fundlane.io
    autoDeployTrigger: checksPass
    disk:
      name: fundlane-documents
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: MCA_APP_ORIGIN
        value: https://fundlane.io
      - key: MCA_ALLOWED_ORIGINS
        value: https://fundlane.io,https://www.fundlane.io
      - key: MCA_DOCUMENT_STORAGE_PATH
        value: /data/documents
      - key: MCA_DB_POOL_MAX
        value: "10"
      - key: MCA_ASSISTANT_ENABLED
        value: "false"
      - key: MCA_ASSISTANT_DOMAIN_KEY
        sync: false
      - key: MCA_ASSISTANT_SERVICE_URL
        fromService:
          name: fundlane-chatkit
          type: pserv
          property: host
      - key: MCA_ASSISTANT_SIGNING_SECRET
        fromService:
          name: fundlane-chatkit
          type: pserv
          envVarKey: MCA_ASSISTANT_SIGNING_SECRET
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: MCA_DATA_ENCRYPTION_KEY
        sync: false
      - key: MCA_UPLOAD_TOKEN_SECRET
        sync: false
      - key: MCA_DOCUMENT_TOKEN_SECRET
        sync: false
      - key: MCA_CLOSING_ARTIFACT_TOKEN_SECRET
        sync: false
      - key: MCA_CLOSING_EMAIL_PROVIDER
        sync: false
      - key: MCA_CLOSING_POSTMARK_CONNECTIONS_JSON
        sync: false

  - type: pserv
    name: fundlane-chatkit
    runtime: docker
    repo: https://github.com/mbelenkiy29/fundlane
    branch: main
    rootDir: chatkit-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: ohio
    plan: starter
    numInstances: 1
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8000"
      - key: MCA_ASSISTANT_CALLBACK_URL
        value: https://fundlane.io/api/mca/chatkit/internal
      - key: MCA_ASSISTANT_SIGNING_SECRET
        generateValue: true
      - key: MCA_ASSISTANT_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # Supabase-backed durable processing. Configure staging secrets before activation.
  - type: worker
    name: fundlane-document-worker
    runtime: docker
    repo: https://github.com/mbelenkiy29/fundlane
    branch: main
    rootDir: nextjs-version
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    region: ohio
    plan: standard
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MCA_DATA_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: MCA_APP_ORIGIN
        sync: false
      - key: MCA_DOCUMENT_AI_PROVIDER
        value: openai
      - key: MCA_DOCUMENT_AI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MCA_DB_POOL_MAX
        value: "4"
