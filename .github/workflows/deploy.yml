name: Validate Fundlane

on:
  push:
    branches: [main]
    paths: ["nextjs-version/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["nextjs-version/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: nextjs-version
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: nextjs-version/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node scripts/operations/build-monitor.mjs
      - run: git diff --exit-code -- supabase/functions/platform-monitor/index.js
      - run: deno check --node-modules-dir=none --unstable-sloppy-imports scripts/operations/edge-entry.ts
      - run: node scripts/supabase/build.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      # Backup tests run pg_dump/pg_restore against the postgres:17 service; the runner's
      # default client is older and pg_dump refuses newer servers.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - run: pnpm test
        env:
          MCA_TEST_DATABASE_ADMIN_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/postgres
      - run: pnpm build
